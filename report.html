<!DOCTYPE html>
<html>
<head>
<title>Performance Monitor Report</title>
<style>
  body { font-family: 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 40px; margin: 0; }
  .container { max-width: 700px; margin: auto; }
  h1 { color: #00ff00; font-size: 2em; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
  h2 { color: #58a6ff; margin-top: 30px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin: 15px 0; }
  .label { color: #8b949e; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
  .value { font-size: 1.4em; font-weight: bold; margin-top: 5px; }
  .green { color: #00ff00; }
  .red { color: #ff4444; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .footer { color: #8b949e; font-size: 0.8em; margin-top: 40px; border-top: 1px solid #30363d; padding-top: 10px; }
</style>
</head>
<body>
<div class='container'>
  <h1>Smart App Performance Monitor</h1>
  <h2>Bottleneck Report</h2>
  <div class='card'>
    <div class='label'>Total Samples</div>
    <div class='value green'>10</div>
  </div>
  <div class='grid'>
    <div class='card'>
      <div class='label'>Peak CPU</div>
      <div class='value' style='color:#ff4444'>81.4453%</div>
      <div style='color:#8b949e; font-size:0.85em;'>at 09:48:19</div>
    </div>
    <div class='card'>
      <div class='label'>Peak Memory</div>
      <div class='value' style='color:#ff4444'>91%</div>
      <div style='color:#8b949e; font-size:0.85em;'>at 09:48:14</div>
    </div>
    <div class='card'>
      <div class='label'>CPU Breaches</div>
      <div class='value' style='color:#ff4444'>1</div>
    </div>
    <div class='card'>
      <div class='label'>Memory Breaches</div>
      <div class='value' style='color:#ff4444'>10</div>
    </div>
  </div>
  <div class='footer'>Generated by Smart App Performance Monitor</div>
</div>
</body></html>
